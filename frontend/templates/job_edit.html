<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job - HireML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body style="background:#f0f4f8;">
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background:#0d1b2a;">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            <i class="fas fa-brain me-2 text-info"></i>HireML
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/jobs">Jobs</a></li>
                <li class="nav-item"><a class="nav-link active" href="/recruiter">Recruiter</a></li>
                <li class="nav-item"><a class="nav-link" href="/apply">Apply</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-bold text-navy mb-1">
                <i class="fas fa-pen me-2 text-info"></i>Edit Job Posting
            </h2>
            <p class="text-muted mb-0">{{ job.title }}</p>
        </div>
        <a href="/recruiter/jobs/{{ job.id }}" class="btn btn-outline-navy fw-semibold">
            <i class="fas fa-arrow-left me-2"></i>Back to Ranking
        </a>
    </div>

    {% if error %}
    <div class="alert alert-danger border-0 shadow-sm fw-semibold">
        <i class="fas fa-circle-exclamation me-2"></i>{{ error }}
    </div>
    {% endif %}

    <div class="card border-0 shadow-lg">
        <div class="card-header border-0 text-white py-3 px-4" style="background:#0d1b2a;">
            <h5 class="mb-0 fw-bold"><i class="fas fa-briefcase me-2"></i>Job Details</h5>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="/recruiter/jobs/{{ job.id }}/edit">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-navy" for="title">Job Title</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ job.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-navy" for="description">Job Description</label>
                    <textarea class="form-control" id="description" name="description" rows="10" required>{{ job.description }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-navy" for="required_skills">Required Skills</label>
                    <input type="text" class="form-control" id="required_skills" name="required_skills"
                        value="{{ job.required_skills }}" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-navy" for="company_name">Company</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" value="{{ job.company_name or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-navy" for="location">Location</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ job.location or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-navy" for="job_type">Job Type</label>
                        <select class="form-select" id="job_type" name="job_type">
                            {% for item in job_types %}
                            <option value="{{ item }}" {% if job.job_type == item %}selected{% endif %}>{{ item }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-navy" for="work_mode">Work Mode</label>
                        <select class="form-select" id="work_mode" name="work_mode">
                            {% for item in work_modes %}
                            <option value="{{ item }}" {% if job.work_mode == item %}selected{% endif %}>{{ item }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-navy" for="salary_range">Salary</label>
                        <input type="text" class="form-control" id="salary_range" name="salary_range" value="{{ job.salary_range or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-navy" for="experience_level">Experience</label>
                        <input type="text" class="form-control" id="experience_level" name="experience_level" value="{{ job.experience_level or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-navy" for="category">Category</label>
                        <input type="text" class="form-control" id="category" name="category" value="{{ job.category or '' }}">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-navy" for="status">Status</label>
                    <select class="form-select" id="status" name="status">
                        {% for status in job_statuses %}
                        <option value="{{ status }}" {% if job.status == status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-navy fw-semibold px-4">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                    <a href="/recruiter" class="btn btn-outline-secondary fw-semibold">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
