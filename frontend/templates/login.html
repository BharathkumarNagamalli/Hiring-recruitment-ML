<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HireML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-5">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <a href="/" class="text-decoration-none d-inline-flex align-items-center mb-4">
                        <i class="fas fa-brain text-info fs-3 me-2"></i>
                        <span class="fw-bold fs-3 text-navy">HireML</span>
                    </a>
                    <h2 class="fw-bold text-navy mb-1">Welcome back</h2>
                    <p class="text-muted mb-4">Sign in as candidate, recruiter, or admin.</p>

                    {% if error %}
                    <div class="alert alert-danger border-0">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/login">
                        <input type="hidden" name="next" value="{{ next_url }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" name="password" placeholder="Minimum 6 characters" required>
                        </div>
                        <button type="submit" class="btn btn-navy w-100 fw-semibold py-2">
                            <i class="fas fa-right-to-bracket me-2"></i>Login
                        </button>
                    </form>

                    <div class="bg-light rounded p-3 mt-4 small">
                        <div class="fw-bold text-navy mb-2">Demo accounts</div>
                        <div>Candidate: <code>candidate@hireml.local</code> / <code>candidate123</code></div>
                        <div>Recruiter: <code>recruiter@hireml.local</code> / <code>recruiter123</code></div>
                        <div>Admin: <code>admin@hireml.local</code> / <code>admin123</code></div>
                    </div>

                    <div class="text-center mt-4">
                        <span class="text-muted">New here?</span>
                        <a href="/register" class="fw-semibold text-decoration-none">Create account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
