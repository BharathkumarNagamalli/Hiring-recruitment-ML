<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HireML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <a href="/" class="text-decoration-none d-inline-flex align-items-center mb-4">
                        <i class="fas fa-brain text-info fs-3 me-2"></i>
                        <span class="fw-bold fs-3 text-navy">HireML</span>
                    </a>
                    <h2 class="fw-bold text-navy mb-1">Create your account</h2>
                    <p class="text-muted mb-4">Candidates track applications. Recruiters manage hiring.</p>

                    {% if error %}
                    <div class="alert alert-danger border-0">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/register">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Account Type</label>
                            <select class="form-select" name="role" id="roleSelect" onchange="toggleCompany()">
                                <option value="candidate" {% if selected_role == 'candidate' %}selected{% endif %}>Candidate</option>
                                <option value="recruiter" {% if selected_role == 'recruiter' %}selected{% endif %}>Recruiter</option>
                            </select>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Location</label>
                                <input type="text" class="form-control" name="location" placeholder="Hyderabad">
                            </div>
                            <div class="col-12" id="companyWrap">
                                <label class="form-label fw-semibold">Company Name</label>
                                <input type="text" class="form-control" name="company_name" placeholder="Company Pvt Ltd">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-navy w-100 fw-semibold py-2 mt-4">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted">Already registered?</span>
                        <a href="/login" class="fw-semibold text-decoration-none">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function toggleCompany() {
    const role = document.getElementById('roleSelect').value;
    document.getElementById('companyWrap').classList.toggle('d-none', role !== 'recruiter');
}
toggleCompany();
</script>
</body>
</html>
